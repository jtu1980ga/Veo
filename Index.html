<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeoStudio AI Director</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel for direct browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #030712; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [view, setView] = useState('landing');
      const [activeStep, setActiveStep] = useState(1);
      const [statusLog, setStatusLog] = useState([]);
      const [isProcessing, setIsProcessing] = useState(false);
      const [lyricsText, setLyricsText] = useState("Walking down the neon road\nShadows fall, stories untold\nEvery beat takes me higher\nLiving inside the neon fire");
      const [songFile, setSongFile] = useState(null);
      const [characterPhoto, setCharacterPhoto] = useState(null);
      const [captionsStyle, setCaptionsStyle] = useState('karaoke');
      const [cameraMotion, setCameraMotion] = useState('dolly_push');
      const [lightingMood, setLightingMood] = useState('synthwave_neon');
      
      const canvasRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentSec, setCurrentSec] = useState(0);

      const addLog = (msg) => {
        setStatusLog(prev => [...prev, `[${new Date().toLocaleTimeString()}] ${msg}`]);
      };

      const startBuildPipeline = (mode) => {
        setIsProcessing(true);
        setView('pipeline');
        setStatusLog([]);
        setActiveStep(2);
        addLog("Step 2 (Gemini): Validating input files & generating schema...");

        setTimeout(() => {
          setActiveStep(3);
          addLog("Step 3 (Gemini): Aligning lyrics to audio phonemes {AA, EH, IY, OW, UW}...");
        }, 1200);

        setTimeout(() => {
          setActiveStep(4);
          if (mode === 'photo' && characterPhoto) {
            addLog("Step 4 (Gemini): Extracted 468 facial landmarks from uploaded photo. Synthesized 512-d identity vector.");
          } else {
            addLog("Step 4 (Gemini): Auto-synthesized character identity to match lyrical tone.");
          }
        }, 2400);

        setTimeout(() => {
          setActiveStep(5);
          addLog(`Step 5 (Gemini Director): Generating scene plan: Camera=${cameraMotion}, Lighting=${lightingMood}.`);
        }, 3600);

        setTimeout(() => {
          setActiveStep(6);
          addLog("Step 6 (Veo 3.1): Neural video generation in progress. Rendering lip sync and cinematic motion...");
        }, 4800);

        setTimeout(() => {
          setActiveStep(7);
          addLog(`Step 7 (Gemini): Burning timestamped lyrics with style: ${captionsStyle}.`);
        }, 6200);

        setTimeout(() => {
          setActiveStep(8);
          addLog("Step 8 (Gemini): AV Muxing complete. Synchronized master ready.");
          setActiveStep(9);
          setIsProcessing(false);
          setIsPlaying(true);
        }, 7600);
      };

      // Realtime Canvas Performer & Lyric Renderer
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let frameId;

        const render = () => {
          const w = canvas.width;
          const h = canvas.height;
          ctx.fillStyle = "#090d16";
          ctx.fillRect(0, 0, w, h);

          // Dynamic lighting gradient
          const grad = ctx.createRadialGradient(w/2, h/2, 20, w/2, h/2, 350);
          if (lightingMood === 'synthwave_neon') {
            grad.addColorStop(0, "rgba(236, 72, 153, 0.4)");
            grad.addColorStop(0.6, "rgba(124, 58, 237, 0.3)");
            grad.addColorStop(1, "#090d16");
          } else {
            grad.addColorStop(0, "rgba(59, 130, 246, 0.4)");
            grad.addColorStop(1, "#090d16");
          }
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          // Simulated Character
          const t = Date.now() / 1000;
          const bobY = isPlaying ? Math.sin(t * 4) * 8 : 0;
          const charX = w / 2;
          const charY = h / 2 + bobY - 20;

          // Head / Body
          ctx.fillStyle = "#1e293b";
          ctx.beginPath();
          ctx.arc(charX, charY, 90, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#a855f7";
          ctx.lineWidth = 4;
          ctx.stroke();

          // Eyes
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.arc(charX - 30, charY - 15, 10, 0, Math.PI * 2);
          ctx.arc(charX + 30, charY - 15, 10, 0, Math.PI * 2);
          ctx.fill();

          // Animated Mouth (Simulated Lip Sync)
          ctx.fillStyle = "#f43f5e";
          ctx.beginPath();
          const mouthOpen = isPlaying ? Math.abs(Math.sin(t * 8)) * 25 + 5 : 4;
          ctx.ellipse(charX, charY + 40, 26, mouthOpen, 0, 0, Math.PI * 2);
          ctx.fill();

          // Lyric burning overlay
          if (isPlaying) {
            ctx.font = "bold 24px sans-serif";
            ctx.textAlign = "center";
            const lines = lyricsText.split("\n").filter(Boolean);
            const activeLine = lines[Math.floor((t % 16) / 4) % lines.length] || "Singing...";

            if (captionsStyle === 'karaoke') {
              ctx.fillStyle = "#eab308";
              ctx.fillText(activeLine, w / 2, h - 60);
              // Bouncing ball
              const ballX = (w / 2 - 120) + ((t * 80) % 240);
              const ballY = h - 95 - Math.abs(Math.sin(t * 6)) * 18;
              ctx.beginPath();
              ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = "#ffffff";
              ctx.fillText(activeLine, w / 2, h - 60);
            }
          }

          frameId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(frameId);
      }, [isPlaying, lightingMood, captionsStyle, lyricsText]);

      return (
        <div className="min-h-screen flex flex-col bg-gray-950 text-gray-100">
          {/* Header */}
          <header className="border-b border-gray-800 bg-gray-900/60 backdrop-blur px-6 py-4 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center font-bold text-white text-lg">V</div>
              <div>
                <h1 className="font-bold text-lg leading-tight">VeoStudio Director</h1>
                <p className="text-xs text-indigo-400 font-mono">Gemini 1.5 + Veo 3.1 Engine</p>
              </div>
            </div>
            <button onClick={() => setView('landing')} className="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg border border-gray-700">
              New Creation
            </button>
          </header>

          {/* Body */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6">
            {view === 'landing' ? (
              <div className="max-w-3xl mx-auto py-8">
                <div className="text-center mb-8">
                  <h2 className="text-3xl font-extrabold tracking-tight mb-2">What would you like to create?</h2>
                  <p className="text-gray-400">Upload your assets or let AI write and orchestrate everything.</p>
                </div>

                <div className="grid sm:grid-cols-2 gap-4 mb-8">
                  {/* Option 1: Song + Lyrics */}
                  <div className="bg-gray-900/80 border border-gray-800 hover:border-indigo-500 p-6 rounded-2xl cursor-pointer transition flex flex-col justify-between"
                       onClick={() => setView('build_song')}>
                    <div>
                      <div className="w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xl font-bold mb-4">🎵</div>
                      <h3 className="font-bold text-lg mb-1">Song & Lyrics Only</h3>
                      <p className="text-xs text-gray-400">Upload lyrics & audio. AI builds character, cinematic lighting, phoneme lip sync, and scene direction.</p>
                    </div>
                    <button className="mt-6 w-full bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold py-2.5 rounded-xl">
                      Choose This
                    </button>
                  </div>

                  {/* Option 2: Song + Lyrics + Character */}
                  <div className="bg-gray-900/80 border border-gray-800 hover:border-pink-500 p-6 rounded-2xl cursor-pointer transition flex flex-col justify-between"
                       onClick={() => setView('build_character')}>
                    <div>
                      <div className="w-12 h-12 rounded-xl bg-pink-600/20 text-pink-400 flex items-center justify-center text-xl font-bold mb-4">👤</div>
                      <h3 className="font-bold text-lg mb-1">Song, Lyrics + Character</h3>
                      <p className="text-xs text-gray-400">Upload your character photo, audio, and lyrics. Gemini extracts identity embedding for Veo 3.1 to bring them to life.</p>
                    </div>
                    <button className="mt-6 w-full bg-pink-600 hover:bg-pink-500 text-sm font-semibold py-2.5 rounded-xl">
                      Choose This
                    </button>
                  </div>
                </div>

                <div className="text-center">
                  <button onClick={() => startBuildPipeline('demo')} className="text-xs text-gray-400 underline hover:text-white">
                    Or run instant quick demo with sample assets
                  </button>
                </div>
              </div>
            ) : view.startsWith('build_') ? (
              <div className="max-w-2xl mx-auto bg-gray-900/80 border border-gray-800 p-6 rounded-2xl space-y-5">
                <h2 className="text-xl font-bold">
                  {view === 'build_character' ? 'Upload Song, Lyrics & Character' : 'Upload Song & Lyrics'}
                </h2>

                {view === 'build_character' && (
                  <div>
                    <label className="block text-xs font-bold text-gray-300 uppercase mb-2">Character Portrait Photo</label>
                    <input type="file" accept="image/*" onChange={(e) => setCharacterPhoto(e.target.files[0]?.name)} 
                           className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-gray-800 file:text-gray-200 hover:file:bg-gray-700 cursor-pointer" />
                    {characterPhoto && <p className="text-xs text-green-400 mt-1">✓ Selected: {characterPhoto}</p>}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-gray-300 uppercase mb-2">Song Audio (MP3 / WAV)</label>
                  <input type="file" accept="audio/*" onChange={(e) => setSongFile(e.target.files[0]?.name)} 
                         className="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-gray-800 file:text-gray-200 hover:file:bg-gray-700 cursor-pointer" />
                  {songFile && <p className="text-xs text-green-400 mt-1">✓ Selected: {songFile}</p>}
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-300 uppercase mb-2">Lyrics</label>
                  <textarea rows="4" value={lyricsText} onChange={(e) => setLyricsText(e.target.value)}
                            className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-indigo-500 font-mono" />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Lyrics Style</label>
                    <select value={captionsStyle} onChange={(e) => setCaptionsStyle(e.target.value)}
                            className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
                      <option value="karaoke">Karaoke Bouncing Ball</option>
                      <option value="classic">Standard Subtitles</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Visual Theme</label>
                    <select value={lightingMood} onChange={(e) => setLightingMood(e.target.value)}
                            className="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs">
                      <option value="synthwave_neon">Neon / Synthwave</option>
                      <option value="cinematic_blue">Cinematic Cool Blue</option>
                    </select>
                  </div>
                </div>

                <button onClick={() => startBuildPipeline(view === 'build_character' ? 'photo' : 'song')}
                        className="w-full py-3 bg-gradient-to-r from-indigo-500 to-pink-500 hover:opacity-90 font-bold rounded-xl text-sm transition">
                  Let AI Build Everything Else 🚀
                </button>
              </div>
            ) : (
              /* Pipeline & Video Stage */
              <div className="grid lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 space-y-4">
                  <div className="relative rounded-2xl overflow-hidden border border-gray-800 bg-black aspect-video flex items-center justify-center">
                    <canvas ref={canvasRef} width={640} height={360} className="w-full h-full object-contain" />
                  </div>

                  <div className="flex items-center justify-between bg-gray-900 border border-gray-800 p-4 rounded-xl">
                    <div className="flex items-center space-x-3">
                      <button onClick={() => setIsPlaying(!isPlaying)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-bold">
                        {isPlaying ? 'Pause' : 'Play'}
                      </button>
                      <span className="text-xs text-gray-400">Step {activeStep} of 9</span>
                    </div>

                    <button onClick={() => alert("Downloading MP4 master...")} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-bold flex items-center space-x-2">
                      <span>Download MP4</span>
                    </button>
                  </div>
                </div>

                <div className="bg-gray-900/80 border border-gray-800 rounded-2xl p-4 flex flex-col h-[450px]">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Gemini & Veo 3.1 Pipeline Log</h3>
                  <div className="flex-1 bg-black/50 border border-gray-800 rounded-xl p-3 font-mono text-[11px] text-gray-300 overflow-y-auto space-y-2">
                    {statusLog.map((log, i) => (
                      <div key={i} className="leading-relaxed">{log}</div>
                    ))}
                    {isProcessing && <div className="text-indigo-400 animate-pulse">Running next workflow block...</div>}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
