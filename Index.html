<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google AI Studio - Veo 3.1 & Imagen Director</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #030712; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
      const [promptText, setPromptText] = useState("A cinematic singer performing under dramatic volumetric neon lighting, 35mm film grain, photorealistic 8k");
      const [lyricsText, setLyricsText] = useState("Walking down the neon road\nShadows fall, stories untold\nEvery beat takes me higher");
      const [outputType, setOutputType] = useState('image'); // 'image' (Imagen 3) or 'video' (Veo 3.1)
      const [aspectRatio, setAspectRatio] = useState('16:9');
      const [statusLog, setStatusLog] = useState([]);
      const [isGenerating, setIsGenerating] = useState(false);
      const [generatedMediaUrl, setGeneratedMediaUrl] = useState(null);

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('gemini_api_key', key);
      };

      const addLog = (msg) => {
        setStatusLog(prev => [...prev, `[${new Date().toLocaleTimeString()}] ${msg}`]);
      };

      // 1. Image Generation using Imagen 3
      const generateImageWithImagen = async () => {
        addLog("Sending request to Google Imagen 3 (imagen-3.0-generate-002)...");
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`;
        
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            instances: [{ prompt: `${promptText}. Visual style for song lyrics: "${lyricsText.slice(0, 100)}"` }],
            parameters: {
              sampleCount: 1,
              aspectRatio: aspectRatio,
              outputMimeType: "image/jpeg"
            }
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || "Failed to generate image");
        }

        const data = await res.json();
        const base64Data = data.predictions?.[0]?.bytesBase64Encoded;
        if (!base64Data) throw new Error("No image data returned from Google Imagen API.");
        
        addLog("✓ High-resolution photo generated successfully!");
        setGeneratedMediaUrl(`data:image/jpeg;base64,${base64Data}`);
      };

      // 2. Video Generation using Veo 3.1
      const generateVideoWithVeo = async () => {
        addLog("Submitting video generation job to Veo 3.1 (veo-3.1-generate-preview)...");
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/veo-3.1-generate-preview:generateVideos?key=${apiKey}`;

        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: `${promptText}. Performer singing lyrics: "${lyricsText.slice(0, 120)}"`,
            config: {
              aspectRatio: aspectRatio,
              durationSeconds: 6
            }
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error?.message || "Failed to start Veo video task");
        }

        const initialData = await res.json();
        const operationName = initialData.name;
        addLog(`Job queued in Google Cloud. Operation ID: ${operationName}`);
        addLog("Processing neural video frames (this may take 1-3 minutes)...");

        // Polling loop for asynchronous video generation
        let completed = false;
        let attempts = 0;
        while (!completed && attempts < 60) {
          attempts++;
          await new Promise(r => setTimeout(r, 6000)); // poll every 6 seconds

          const pollEndpoint = `https://generativelanguage.googleapis.com/v1beta/${operationName}?key=${apiKey}`;
          const pollRes = await fetch(pollEndpoint);
          const pollData = await pollRes.json();

          if (pollData.done) {
            completed = true;
            if (pollData.error) {
              throw new Error(pollData.error.message || "Veo generation failed");
            }
            const videoUri = pollData.response?.generatedVideos?.[0]?.video?.uri || pollData.response?.videoUri;
            addLog("✓ Veo 3.1 cinematic video rendered successfully!");
            setGeneratedMediaUrl(videoUri);
            break;
          } else {
            addLog(`Veo rendering progress... (step ${attempts})`);
          }
        }

        if (!completed) throw new Error("Video generation timed out. Please check back later.");
      };

      // Master trigger
      const handleGenerate = async () => {
        if (!apiKey) {
          alert("Please enter your Google Gemini API Key first!");
          return;
        }

        setIsGenerating(true);
        setStatusLog([]);
        setGeneratedMediaUrl(null);

        try {
          addLog("Connecting to Google AI Engine...");
          if (outputType === 'image') {
            await generateImageWithImagen();
          } else {
            await generateVideoWithVeo();
          }
        } catch (error) {
          addLog(`❌ Error: ${error.message}`);
          console.error(error);
        } finally {
          setIsGenerating(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-gray-950 text-gray-100">
          {/* Top Bar with API Key */}
          <header className="border-b border-gray-800 bg-gray-900/70 backdrop-blur px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center font-bold text-white text-sm">G</div>
              <div>
                <h1 className="font-bold text-base leading-tight">Google AI Pro Studio</h1>
                <p className="text-[11px] text-blue-400 font-mono">Veo 3.1 & Imagen 3 Engine</p>
              </div>
            </div>

            <div className="flex items-center space-x-2 w-full sm:w-auto">
              <input 
                type="password" 
                placeholder="Paste Gemini API Key (AIzaSy...)" 
                value={apiKey} 
                onChange={(e) => saveApiKey(e.target.value)}
                className="bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 text-xs text-gray-200 placeholder-gray-500 focus:border-blue-500 focus:outline-none flex-1 sm:w-64"
              />
              <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="text-[11px] text-blue-400 hover:underline whitespace-nowrap">
                Get Key ↗
              </a>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 grid lg:grid-cols-12 gap-6">
            {/* Control Panel (5 cols) */}
            <div className="lg:col-span-5 space-y-4">
              <div className="bg-gray-900/80 border border-gray-800 p-5 rounded-2xl space-y-4">
                <h2 className="text-sm font-bold uppercase tracking-wider text-gray-400">Creation Settings</h2>

                {/* Mode Select */}
                <div>
                  <label className="block text-xs font-bold text-gray-300 uppercase mb-2">Select Generation Mode</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button 
                      onClick={() => setOutputType('image')} 
                      className={`py-2 px-3 rounded-xl border text-xs font-bold transition flex items-center justify-center space-x-2 ${outputType === 'image' ? 'bg-blue-600 border-blue-500 text-white' : 'bg-gray-950 border-gray-800 text-gray-400 hover:border-gray-700'}`}>
                      <span>📸 High-Res Photo</span>
                    </button>
                    <button 
                      onClick={() => setOutputType('video')} 
                      className={`py-2 px-3 rounded-xl border text-xs font-bold transition flex items-center justify-center space-x-2 ${outputType === 'video' ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-gray-950 border-gray-800 text-gray-400 hover:border-gray-700'}`}>
                      <span>🎥 Veo 3.1 Video</span>
                    </button>
                  </div>
                </div>

                {/* Aspect Ratio */}
                <div>
                  <label className="block text-xs font-bold text-gray-300 uppercase mb-1">Aspect Ratio</label>
                  <select 
                    value={aspectRatio} 
                    onChange={(e) => setAspectRatio(e.target.value)}
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl p-2.5 text-xs text-gray-200">
                    <option value="16:9">16:9 Landscape (YouTube / Cinema)</option>
                    <option value="9:16">9:16 Portrait (TikTok / Shorts / Reels)</option>
                    <option value="1:1">1:1 Square (Instagram)</option>
                  </select>
                </div>

                {/* Visual Description */}
                <div>
                  <label className="block text-xs font-bold text-gray-300 uppercase mb-1">Scene & Performer Prompt</label>
                  <textarea 
                    rows="3" 
                    value={promptText} 
                    onChange={(e) => setPromptText(e.target.value)}
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-blue-500 font-mono"
                    placeholder="Describe lighting, character, camera angle..."
                  />
                </div>

                {/* Lyrics Input */}
                <div>
                  <label className="block text-xs font-bold text-gray-300 uppercase mb-1">Song Lyrics / Script</label>
                  <textarea 
                    rows="3" 
                    value={lyricsText} 
                    onChange={(e) => setLyricsText(e.target.value)}
                    className="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-gray-200 focus:outline-none focus:border-blue-500 font-mono"
                    placeholder="Paste lyrics to guide character emotion and sync..."
                  />
                </div>

                {/* Generate Button */}
                <button 
                  onClick={handleGenerate}
                  disabled={isGenerating}
                  className={`w-full py-3.5 rounded-xl font-bold text-sm tracking-wide transition flex items-center justify-center space-x-2 ${isGenerating ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-90 text-white shadow-lg shadow-blue-500/20'}`}>
                  {isGenerating ? (
                    <>
                      <span className="inline-block animate-spin">⏳</span>
                      <span>Calling Google Cloud AI...</span>
                    </>
                  ) : (
                    <span>Generate With Google AI 🚀</span>
                  )}
                </button>
              </div>
            </div>

            {/* Display & Output Screen (7 cols) */}
            <div className="lg:col-span-7 space-y-4">
              <div className="bg-gray-900/80 border border-gray-800 rounded-2xl overflow-hidden flex flex-col h-[520px]">
                {/* Visual Viewport */}
                <div className="flex-1 bg-black flex items-center justify-center relative overflow-hidden">
                  {generatedMediaUrl ? (
                    outputType === 'image' ? (
                      <img src={generatedMediaUrl} alt="Google AI Generated" className="w-full h-full object-contain" />
                    ) : (
                      <video src={generatedMediaUrl} controls autoPlay loop className="w-full h-full object-contain" />
                    )
                  ) : (
                    <div className="text-center p-6 text-gray-600">
                      <div className="text-4xl mb-2">{outputType === 'image' ? '📸' : '🎥'}</div>
                      <p className="text-sm font-semibold">Output will appear here directly from Google AI</p>
                      <p className="text-xs text-gray-600 mt-1">Paste your key and click Generate</p>
                    </div>
                  )}

                  {isGenerating && (
                    <div className="absolute inset-0 bg-black/75 backdrop-blur-sm flex flex-col items-center justify-center text-center p-6">
                      <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                      <p className="text-sm font-bold text-white">Google AI is rendering your masterpiece...</p>
                      <p className="text-xs text-gray-400 mt-1">Generating photorealistic frames via Google Cloud</p>
                    </div>
                  )}
                </div>

                {/* Action Bar */}
                {generatedMediaUrl && (
                  <div className="p-3 bg-gray-900 border-t border-gray-800 flex items-center justify-between">
                    <span className="text-xs text-green-400 font-mono">✓ High-Quality AI Master Ready</span>
                    <a 
                      href={generatedMediaUrl} 
                      download={outputType === 'image' ? "ai-master.jpg" : "veo-video.mp4"}
                      target="_blank"
                      className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-bold text-white transition">
                      Download HD File
                    </a>
                  </div>
                )}
              </div>

              {/* Real-time Cloud Logs */}
              <div className="bg-gray-900/60 border border-gray-800 rounded-xl p-3 font-mono text-[11px] text-gray-400 h-28 overflow-y-auto space-y-1">
                <div className="text-gray-500 font-bold">Google Cloud Terminal:</div>
                {statusLog.map((log, i) => (
                  <div key={i} className="text-gray-300 leading-tight">{log}</div>
                ))}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
